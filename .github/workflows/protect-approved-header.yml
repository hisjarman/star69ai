name: Protect approved Star69AI homepage shell

on:
  pull_request:
    paths:
      - "site-header.js"
      - "site-header.css"
      - "homepage-cinematic-banner.css"
      - "assets/visitor-arrival.js"
      - "assets/visitor-arrival.css"
      - "assets/visitor-welcome.js"
      - "index.html"
      - ".github/workflows/protect-approved-header.yml"
      - "project-context/STAR69AI_HEADER_DESIGN_LOCK.md"
  push:
    branches: [main]
    paths:
      - "site-header.js"
      - "site-header.css"
      - "homepage-cinematic-banner.css"
      - "assets/visitor-arrival.js"
      - "assets/visitor-arrival.css"
      - "assets/visitor-welcome.js"
      - "index.html"
      - ".github/workflows/protect-approved-header.yml"

permissions:
  contents: read

jobs:
  approved-homepage-shell-lock:
    name: Verify approved header, banner, navigation and arrival
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce approved source fingerprints
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            ["site-header.js"]="91345fff344c78dd565194b7686522cc4eba208a"
            ["site-header.css"]="6cb04dcb2003f628e10b55b27ee3a8fac4fc9be2"
            ["homepage-cinematic-banner.css"]="1d0a45af2c1b9b5ee3e3d57837c251e5af87d724"
            ["assets/visitor-arrival.js"]="7345e48335299defd6a5b8a64810a2f49322cba3"
            ["assets/visitor-arrival.css"]="1271294260b0c2e0b070527702f5666ade5b46d0"
            ["assets/visitor-welcome.js"]="36bfac8399a9c57d0632fb0ea49dd97de0566571"
          )
          for path in "${!expected[@]}"; do
            actual="$(git rev-parse "HEAD:$path")"
            if [[ "$actual" != "${expected[$path]}" ]]; then
              echo "::error::Protected Star69AI file changed: $path"
              echo "An explicit owner-approved design revision is required before updating its fingerprint."
              exit 1
            fi
          done
          echo "All six approved source files match their frozen fingerprints."

      - name: Verify homepage protected markup remains present and singular
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          checks = {
              "one homepage banner": html.count('class="s69-home-banner"') == 1,
              "one greeting wrapper": html.count('class="s69-visitor-greeting-wrap"') == 1,
              "banner before greeting": html.find('class="s69-home-banner"') < html.find('class="s69-visitor-greeting-wrap"'),
              "arrival flag target": 'class="site-global-arrival-flag"' in html,
              "welcome bubble target": 'class="site-global-welcome-bubble"' in html,
              "homepage arrival script": '/assets/visitor-arrival.js' in html,
              "location greeting script": '/assets/visitor-welcome.js' in html,
              "cinematic banner stylesheet": '/homepage-cinematic-banner.css' in html,
              "arrival stylesheet": '/assets/visitor-arrival.css' in html,
          }
          for label, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + label)
          if not all(checks.values()):
              raise SystemExit("Protected homepage banner/greeting structure failed.")
          PY
