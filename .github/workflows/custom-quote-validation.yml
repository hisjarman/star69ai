name: Custom quote workflow validation

on:
  pull_request:
    paths:
      - "cloudflare/platform-worker.js"
      - "client/client.js"
      - "admin/admin.js"
      - "cloudflare/migrations/20261119_addon_quotes.sql"
      - "cloudflare/migrations/20261119_internal_cost_knowledge.sql"
      - ".github/workflows/custom-quote-validation.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/platform-worker.js"
      - "client/client.js"
      - "admin/admin.js"
      - "cloudflare/migrations/20261119_addon_quotes.sql"
      - ".github/workflows/custom-quote-validation.yml"

permissions:
  contents: read

jobs:
  syntax-and-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check cloudflare/platform-worker.js
          node --check client/client.js
          node --check admin/admin.js
      - name: Smoke-test quote migration and acceptance fields
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.executescript("""
          CREATE TABLE avr_addon_orders (
            id TEXT PRIMARY KEY,
            customer_id TEXT NOT NULL,
            addon_key TEXT NOT NULL,
            addon_name TEXT NOT NULL,
            billing_type TEXT NOT NULL,
            status TEXT NOT NULL DEFAULT 'requested',
            customer_note TEXT,
            admin_note TEXT,
            stripe_checkout_session_id TEXT,
            created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
            updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          """)
          db.executescript(Path("cloudflare/migrations/20261119_addon_quotes.sql").read_text())
          db.execute(
            "INSERT INTO avr_addon_orders(id,customer_id,addon_key,addon_name,billing_type) VALUES(?,?,?,?,?)",
            ("test-1", "customer-1", "directory_operator", "Intelligent Directory Operator", "quote"),
          )
          row = db.execute(
            "SELECT quote_status,quote_summary,quote_accepted_at,quote_accepted_by FROM avr_addon_orders WHERE id='test-1'"
          ).fetchone()
          assert row[0] == "none", row
          db.execute(
            "UPDATE avr_addon_orders SET quote_summary=?,quote_status='presented' WHERE id='test-1'",
            ("Approved scope and itemized quote",),
          )
          db.execute(
            "UPDATE avr_addon_orders SET quote_status='accepted',quote_accepted_at=?,quote_accepted_by=? WHERE id='test-1' AND quote_status='presented'",
            ("2026-11-19T00:00:00Z", "clerk-user-test"),
          )
          accepted = db.execute(
            "SELECT quote_status,quote_accepted_at,quote_accepted_by FROM avr_addon_orders WHERE id='test-1'"
          ).fetchone()
          assert accepted == ("accepted", "2026-11-19T00:00:00Z", "clerk-user-test"), accepted
          try:
            db.execute("UPDATE avr_addon_orders SET quote_status='invalid' WHERE id='test-1'")
            raise AssertionError("Invalid quote state unexpectedly accepted")
          except sqlite3.IntegrityError:
            pass
          db.executescript(Path("cloudflare/migrations/20261119_internal_cost_knowledge.sql").read_text())
          catalog_columns = {row[1] for row in db.execute("PRAGMA table_info(avr_internal_cost_knowledge)")}
          assert {"id", "title", "content", "source_reviewed_at", "updated_at", "updated_by"} <= catalog_columns, catalog_columns
          print("Passed: quote columns, default state, presentation, acceptance timestamp/actor, quote-state constraint, and internal cost knowledge schema.")
          PY
