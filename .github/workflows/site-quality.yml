name: Site quality — responsive and SEO

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seo:
    name: SEO and sitemap integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate public page metadata and sitemap
        run: node scripts/check-site-seo.mjs

  responsive:
    name: Responsive browser smoke tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/star69ai-http.log 2>&1 &
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/star69ai-http.log
          exit 1
      - name: Test public pages at mobile, tablet and desktop widths
        run: node scripts/visual-smoke.mjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star69ai-responsive-qa
          path: artifacts/site-qa/
          if-no-files-found: ignore
