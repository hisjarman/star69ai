name: Protect approved Star69AI cinematic header

on:
  pull_request:
    paths:
      - "site-header.js"
      - "site-header.css"
      - ".github/workflows/protect-approved-header.yml"
      - "project-context/STAR69AI_HEADER_DESIGN_LOCK.md"
  push:
    branches: [main]
    paths:
      - "site-header.js"
      - "site-header.css"
      - ".github/workflows/protect-approved-header.yml"

permissions:
  contents: read

jobs:
  approved-header-lock:
    name: Verify approved header design is unchanged
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce approved header and menu
        shell: bash
        run: |
          set -euo pipefail
          expected_js="7eb9798412d112f3b4a900d71c41e09dd719a7e3"
          expected_css="287b90d5eba3aadc83125e5939fc423864025cfe"
          actual_js="$(git rev-parse HEAD:site-header.js)"
          actual_css="$(git rev-parse HEAD:site-header.css)"

          if [[ "$actual_js" != "$expected_js" ]]; then
            echo "::error::The approved Star69AI cinematic header/menu JavaScript was changed."
            echo "Restore the locked version or obtain explicit approval to revise the design lock."
            exit 1
          fi

          if [[ "$actual_css" != "$expected_css" ]]; then
            echo "::error::The approved Star69AI cinematic header/menu CSS was changed."
            echo "Restore the locked version or obtain explicit approval to revise the design lock."
            exit 1
          fi

          echo "Approved Star69AI homepage hero, compact interior Mission Control menu, navigation and footer styles are unchanged."
